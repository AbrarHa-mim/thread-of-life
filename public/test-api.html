<!DOCTYPE html>
<html>
<head>
  <title>API Test - Thread of Life</title>
  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #F2EDE4;
      color: #1A1A1A;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    button {
      background: #1A1A1A;
      color: #F2EDE4;
      border: none;
      padding: 12px 24px;
      font-family: inherit;
      cursor: pointer;
      margin: 10px 0;
    }
    button:hover {
      background: #C4422D;
    }
    pre {
      background: #fff;
      padding: 20px;
      overflow: auto;
      border: 1px solid #D6CFC3;
    }
    input {
      background: transparent;
      border: none;
      border-bottom: 2px solid #1A1A1A;
      padding: 8px 0;
      font-size: 16px;
      font-family: inherit;
      margin: 10px 0;
      width: 200px;
    }
    .status {
      padding: 12px;
      margin: 10px 0;
      border: 2px solid;
    }
    .success { border-color: #4CAF50; color: #4CAF50; }
    .error { border-color: #C4422D; color: #C4422D; }
  </style>
</head>
<body>
  <h1>API Test - /api/generate</h1>

  <div>
    <label>Name: <input type="text" id="name" value="Test User" /></label><br/>
    <label>Age: <input type="number" id="age" value="25" /></label><br/>
    <button onclick="testAPI()">Test API</button>
  </div>

  <div id="status"></div>
  <div id="result"></div>

  <script>
    async function testAPI() {
      const name = document.getElementById('name').value;
      const age = parseInt(document.getElementById('age').value);
      const statusDiv = document.getElementById('status');
      const resultDiv = document.getElementById('result');

      statusDiv.innerHTML = '<div class="status">⏳ Testing API...</div>';
      resultDiv.innerHTML = '';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ name, age })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();

        statusDiv.innerHTML = '<div class="status success">✓ API Working! Status: ' + response.status + '</div>';
        resultDiv.innerHTML = '<h2>Response:</h2><pre>' + JSON.stringify(data, null, 2) + '</pre>';

      } catch (error) {
        statusDiv.innerHTML = '<div class="status error">✗ API Error: ' + error.message + '</div>';
        resultDiv.innerHTML = '<pre>Check console for details</pre>';
        console.error('API Error:', error);
      }
    }

    // Auto-test on load
    window.addEventListener('load', () => {
      setTimeout(testAPI, 500);
    });
  </script>
</body>
</html>
